name: CI

on:
  push:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # La simulation doit donner exactement le même résultat sur toutes les plateformes
  # (condition du multijoueur en lockstep) : ses tests tournent sur les trois systèmes.
  sim-tests:
    name: Simulation (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p gem_sim

  lint:
    name: Format et Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Dépendances Linux de Bevy
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  # Exécutables portables : rien à installer, on télécharge et on lance.
  desktop:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            exe: black_gem
          - name: windows
            os: windows-latest
            target: x86_64-pc-windows-msvc
            exe: black_gem.exe
          - name: macos
            os: macos-latest
            target: aarch64-apple-darwin
            exe: black_gem
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Dépendances Linux de Bevy
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: cargo build -p black_gem --release --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: black-gem-${{ matrix.name }}
          path: target/${{ matrix.target }}/release/${{ matrix.exe }}

  web:
    name: Build web (WebGPU + WebGL2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target/web-webgl2
            . -> target/web-webgpu
      - name: Installer wasm-opt (binaryen)
        run: |
          curl -sSfL https://github.com/WebAssembly/binaryen/releases/download/version_123/binaryen-version_123-x86_64-linux.tar.gz | tar xz
          echo "$PWD/binaryen-version_123/bin" >> "$GITHUB_PATH"
      - name: Installer wasm-bindgen (même version que Cargo.lock)
        run: |
          version=$(cargo metadata --format-version 1 --locked | jq -r '.packages[] | select(.name == "wasm-bindgen") | .version')
          cargo install wasm-bindgen-cli --locked --version "$version"
      - run: ./scripts/build-web.sh
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/web

  # Publication de la version web sur GitHub Pages (branche par défaut du dépôt uniquement).
  # À activer une fois : Settings > Pages > Source : « GitHub Actions ».
  deploy-web:
    name: Publier la version web
    if: github.ref_name == github.event.repository.default_branch
    needs: web
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
