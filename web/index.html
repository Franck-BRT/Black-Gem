<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0b0612">
  <link rel="manifest" href="manifest.webmanifest">
  <title>Black Gem</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0b0612; overflow: hidden; touch-action: none; }
    canvas#bevy { display: block; width: 100%; height: 100%; outline: none; }
    #loading {
      position: fixed; inset: 0; display: flex; flex-direction: column; gap: 12px;
      align-items: center; justify-content: center;
      color: #c79bff; font: 600 20px system-ui, sans-serif; letter-spacing: 0.2em;
    }
    #loading small { color: #8a7f99; font-weight: 400; letter-spacing: 0.05em; font-size: 13px; }
  </style>
</head>
<body>
  <div id="loading">BLACK GEM<small id="status">Chargement…</small></div>
  <canvas id="bevy"></canvas>
  <script type="module">
    // WebGPU si le navigateur le permet (meilleur rendu), sinon WebGL2 (compatibilité maximale).
    async function hasWebGpu() {
      try {
        return !!navigator.gpu && !!(await navigator.gpu.requestAdapter());
      } catch {
        return false;
      }
    }
    const backend = (await hasWebGpu()) ? "webgpu" : "webgl2";
    document.getElementById("status").textContent = `Chargement… (${backend})`;
    try {
      const game = await import(`./${backend}/black_gem.js`);
      await game.default();
    } catch (error) {
      // Bevy/winit rend la main via une exception volontaire : on l'ignore.
      if (!String(error).includes("Using exceptions for control flow")) {
        document.getElementById("status").textContent = `Erreur : ${error}`;
        throw error;
      }
    }
  </script>
  <script>
    // Retire l'écran de chargement à la première image.
    new MutationObserver((_, observer) => {
      const canvas = document.getElementById("bevy");
      if (canvas.width > 300) {
        document.getElementById("loading").remove();
        observer.disconnect();
      }
    }).observe(document.getElementById("bevy"), { attributes: true });
  </script>
</body>
</html>
