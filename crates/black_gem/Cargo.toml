[package]
name = "black_gem"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
gem_script.workspace = true
gem_sim.workspace = true
bevy = { workspace = true, features = ["system_clipboard"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Sauvegarde dans le navigateur (localStorage).
[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = ["Window", "Storage"] }

[features]
# Version web avec WebGPU (sinon WebGL2). Sans effet sur les versions ordinateur.
webgpu = ["bevy/webgpu"]
